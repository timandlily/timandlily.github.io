name: Sync Weekly Research Briefing
on:
  repository_dispatch:
    types: [new-briefing]
  schedule:
    - cron: '30 6 * * 0'
  workflow_dispatch:
jobs:
  sync-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4
      - name: Checkout research-briefings repo
        uses: actions/checkout@v4
        with:
          repository: timandlily/research-briefings
          token: ${{ secrets.BRIEFINGS_TOKEN }}
          path: briefings-source
      - name: Find latest Hugo briefing file
        id: find
        run: |
          LATEST=$(ls briefings-source/ | grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}-weekly-briefing-hugo\.md$" | sort -r | head -1)
          if [ -z "$LATEST" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            DATE=$(echo "$LATEST" | grep -oP '\d{4}-\d{2}-\d{2}')
            echo "found=true" >> $GITHUB_OUTPUT
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "file=$LATEST" >> $GITHUB_OUTPUT
          fi
      - name: Copy briefing to blog content folder
        if: steps.find.outputs.found == 'true'
        run: |
          DEST="content/blog/${{ steps.find.outputs.date }}-weekly-briefing.md"
          if [ -f "$DEST" ]; then
            echo "Already exists, skipping."
            echo "skip=true" >> $GITHUB_ENV
          else
            cp "briefings-source/${{ steps.find.outputs.file }}" "$DEST"
            echo "skip=false" >> $GITHUB_ENV
          fi
      - name: Commit and push
        if: steps.find.outputs.found == 'true' && env.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git diff --staged --quiet && echo "Nothing to commit." || \
            (git commit -m "Add weekly briefing ${{ steps.find.outputs.date }}" && \
            git pull --rebase && git push)
