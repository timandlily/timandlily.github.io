name: Sync Weekly Research Briefing

on:
  # research-briefings repo가 push되면 이 워크플로우를 트리거
  repository_dispatch:
    types: [new-briefing]
  # 또는 매주 일요일 오전 9시 30분(리야드 시간 = UTC+3 → UTC 06:30)에 자동 실행
  schedule:
    - cron: '30 6 * * 0'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  sync-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v4

      - name: Checkout research-briefings repo
        uses: actions/checkout@v4
        with:
          repository: timandlily/research-briefings
          token: ${{ secrets.BRIEFINGS_TOKEN }}
          path: briefings-source

      - name: Find latest Hugo briefing file
        id: find
        run: |
          LATEST=$(ls briefings-source/ | grep "^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-weekly-briefing-hugo.md" | sort -r | head -1)
          if [ -z "$LATEST" ]; then
            echo "No new briefing found."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            DATE=$(echo "$LATEST" | grep -oP '\d{4}-\d{2}-\d{2}')
            echo "found=true" >> $GITHUB_OUTPUT
            echo "date=$DATE" >> $GITHUB_OUTPUT
            echo "file=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Copy briefing to blog content folder
        if: steps.find.outputs.found == 'true'
        run: |
          DIR="content/blog/${{ steps.find.outputs.date }}-weekly-briefing"
          mkdir -p "$DIR"
          cp "briefings-source/${{ steps.find.outputs.file }}" "$DIR/index.md"
          echo "✅ Copied to $DIR/index.md"

      - name: Commit and push
        if: steps.find.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git diff --staged --quiet && echo "No changes to commit" || \
            (git commit -m "Add weekly briefing ${{ steps.find.outputs.date }}" && git push)
