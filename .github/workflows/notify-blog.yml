name: Notify Blog on New Briefing

on:
  push:
    paths:
      - '*-weekly-briefing-hugo.md'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog repo workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.BLOG_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/timandlily/timandlily.github.io/dispatches \
            -d '{"event_type":"new-briefing"}'
