bio: |
  Dr. Seokhee Lee is an Assistant Professor and Program Director in the 
  Department of Cybersecurity and Digital Forensics at Naif Arab University 
  for Security Sciences (NAUSS), Riyadh, Saudi Arabia. He is the first PhD 
  in Digital Forensics in Korea. His expertise spans Cyber Threat Intelligence, 
  Digital Forensics, and Incident Response, with 18+ years of experience across 
  academia, government, and legal sectors.
