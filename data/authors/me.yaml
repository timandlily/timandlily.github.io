experience:
  - role: Assistant Professor & Program Director
    org: NAUSS (Naif Arab University for Security Sciences)
    start: 2022-06-01
    summary: |
      Teaching Cyber Threat Intelligence, Incident Analysis and Response, 
      Digital Forensics and Evidence Seizure, and Smart City Forensics 
      for master's degree students. Directing the Cybersecurity and Digital 
      Forensics Program. Delivered Interpol-recognized Cyber Crime Investigation training.
  - role: Director for Cyber Security Division (CISO / CPO / Chief of CERT)
    org: NIRS (National Information and Resource Services), Ministry of the Interior
    start: 2017-06-01
    end: 2022-05-31
    summary: |
      Led information security for Korea's government data center serving 45 ministries. 
      Built AI-based security monitoring system (AIRIS). Joined FIRST international 
      incident response consortium. Established ISMS-P certification — first in Korean 
      public sector. Responded to 23 cyber incidents as CERT chief.Served as information security committee member for the 2018 PyeongChang 
      Winter Olympics.
  - role: Digital Forensic Expert
    org: Kim & Chang Law Firm (K&C)
    start: 2008-02-01
    end: 2017-05-31
    summary: |
      Handled trade secret leakage, e-discovery, and digital forensics for Korea's 
      largest law firm. Supported cross-border litigation including U.S. class action 
      suits. 
